<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>LATENT POEM — Three-Sided Archive · Generation 20</title>
  <style>
    :root{
      --h:100dvh;
      --paper:#efe8dc;
      --ink:#090908;
      --red:#d33526;
      --red-bright:#ff5a45;
      --line:rgba(239,232,220,.22);
      --turn:-45deg;
      --turn-time:1800ms;
      --ease:cubic-bezier(.65,0,.18,1);
      --font-ui:"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;
      --font-poem:"Iowan Old Style",Baskerville,"Times New Roman",serif;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030303;color:var(--paper)}
    body{font-family:var(--font-ui);overscroll-behavior:none}
    button,input{font:inherit}
    button{color:inherit}
    button:focus-visible,input:focus-visible{outline:2px solid var(--red-bright);outline-offset:4px}
    .app{position:fixed;inset:0;height:var(--h);overflow:hidden;background:#050505;isolation:isolate}
    .grain{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.08;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitchTiles'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.62'/%3E%3C/svg%3E")}

    /* One real 3D cube. Every face overdraws its edges slightly so Safari never
       reveals the white anti-aliasing crack that used to flash mid-turn. */
    .scene{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 50%;overflow:hidden}
    .camera{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--pitch,0deg)) rotateY(var(--look,0deg));transition:transform .32s ease-out}
    .world{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 50%;transform:translateZ(calc(-50vw - 2px)) rotateY(var(--turn));transition:transform var(--turn-time) var(--ease);will-change:transform}
    .world.no-transition{transition:none!important}
    .face{position:absolute;left:-2px;top:-2px;width:calc(100vw + 4px);height:calc(var(--h) + 4px);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;background:#050505;outline:2px solid #050505}
    .face-exposure{transform:rotateY(0deg) translateZ(calc(50vw + 1px));background:#a79c8b}
    .face-develop{transform:rotateY(90deg) translateZ(calc(50vw + 1px));background:#070303}
    .face-nebula{transform:rotateY(180deg) translateZ(calc(50vw + 1px));background:#030409}
    .face::after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;box-shadow:inset 0 0 100px rgba(0,0,0,.35);transition:background 1s ease,box-shadow 1s ease}
    .app[data-view="edge"] .face-exposure::after{background:linear-gradient(90deg,rgba(4,4,3,.36),transparent 54%)}
    .app[data-view="edge"] .face-develop::after{background:linear-gradient(90deg,transparent 46%,rgba(0,0,0,.48))}
    .app[data-view="edge"]{--turn:-45deg}
    .app[data-view="exposure"]{--turn:0deg}
    .app[data-view="develop"]{--turn:-90deg}
    .app[data-view="nebula"]{--turn:-180deg}

    /* Once the rotation lands, the chosen surface is docked as a literal viewport page.
       The geometry immediately before and after docking is pixel-identical, so there is
       no visual cut, but Safari no longer keeps the page inside a projected 3D context. */
    .app[data-docked="true"] .camera,.app[data-docked="true"] .world{transform:none!important;transition:none!important}
    .app[data-view="exposure"][data-docked="true"] .face-exposure,
    .app[data-view="develop"][data-docked="true"] .face-develop,
    .app[data-view="nebula"][data-docked="true"] .face-nebula{left:0;right:auto;top:0;width:100%;height:var(--h);transform:none!important;transform-origin:50% 50%;outline:0}
    .app[data-view="exposure"][data-docked="true"] .face-develop,
    .app[data-view="exposure"][data-docked="true"] .face-nebula,
    .app[data-view="develop"][data-docked="true"] .face-exposure,
    .app[data-view="develop"][data-docked="true"] .face-nebula,
    .app[data-view="nebula"][data-docked="true"] .face-exposure,
    .app[data-view="nebula"][data-docked="true"] .face-develop{visibility:hidden}

    .edge-seam{display:none}

    .brand{position:fixed;z-index:50;top:max(22px,env(safe-area-inset-top));left:max(24px,env(safe-area-inset-left));border:0;background:none;padding:8px 0;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 1px 16px rgba(0,0,0,.55)}
    .brand::before{content:"";display:inline-block;width:8px;height:8px;margin-right:10px;border-radius:50%;background:var(--red-bright);box-shadow:0 0 18px rgba(255,90,69,.75)}
    .view-status{position:fixed;z-index:50;top:max(72px,calc(52px + env(safe-area-inset-top)));right:max(24px,env(safe-area-inset-right));font:10px/1.2 var(--font-ui);letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.64);pointer-events:none}

    .edge-nav{position:fixed;z-index:52;left:50%;bottom:max(24px,calc(18px + env(safe-area-inset-bottom)));transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,auto);gap:10px;opacity:1;visibility:visible;transition:opacity .3s,visibility .3s;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
    .app:not([data-view="edge"]) .edge-nav{opacity:0;visibility:hidden;pointer-events:none}
    .edge-nav button{min-width:clamp(142px,18vw,230px);height:48px;padding:0 18px;border:1px solid rgba(255,255,255,.62);background:rgba(6,6,6,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;color:#fff;font:700 10px/1 var(--font-ui);letter-spacing:.15em;text-transform:uppercase;transition:background .22s,border-color .22s,transform .22s}
    .edge-nav button:hover{background:rgba(211,53,38,.92);border-color:#ff7867;transform:translateY(-3px)}
    .edge-nav button:first-child{text-align:left}.edge-nav button:last-child{text-align:right}

    .nebula-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#030409;pointer-events:none}
    .app[data-view="nebula"][data-docked="true"] .nebula-frame{pointer-events:auto}

    /* A fourth, vertical route: pull the centered handle down to reveal the original v3 field. */
    .nebula-pull{--pull-y:0px;position:fixed;z-index:70;left:50%;bottom:max(88px,calc(78px + env(safe-area-inset-bottom)));width:48px;height:48px;padding:0;border:1px solid rgba(255,255,255,.56);border-radius:50%;background:rgba(5,5,5,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translate(-50%,var(--pull-y));cursor:ns-resize;touch-action:none;transition:opacity .3s,visibility .3s,background .25s,transform .22s;box-shadow:0 12px 32px rgba(0,0,0,.38)}
    .nebula-pull:hover{background:rgba(211,53,38,.9)}
    .nebula-pull span,.nebula-return span{position:absolute;left:50%;top:50%;width:13px;height:13px;border-right:1px solid #fff;border-bottom:1px solid #fff;transform:translate(-50%,-68%) rotate(45deg)}
    .app:not([data-view="edge"]) .nebula-pull,.app.portal-open .nebula-pull{opacity:0;visibility:hidden;pointer-events:none}
    .nebula-portal{position:fixed;inset:0;z-index:100;background:#030407;transform:translateY(-101%);visibility:hidden;pointer-events:none;transition:transform 1250ms cubic-bezier(.65,0,.18,1),visibility 0s linear 1250ms;overflow:hidden;will-change:transform}
    .nebula-portal.open{transform:translateY(0);visibility:visible;pointer-events:auto;transition:transform 1250ms cubic-bezier(.65,0,.18,1),visibility 0s}
    .nebula-portal iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#030407}
    .nebula-return{position:absolute;z-index:4;left:50%;top:max(22px,env(safe-area-inset-top));width:46px;height:46px;padding:0;border:1px solid rgba(255,255,255,.34);border-radius:50%;background:rgba(3,4,7,.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transform:translateX(-50%);cursor:pointer;transition:background .25s,border-color .25s}
    .nebula-return:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.7)}
    .nebula-return span{transform:translate(-50%,-28%) rotate(225deg)}
    .app.portal-open .scene,.app.portal-open .edge-nav,.app.portal-open .brand,.app.portal-open .view-status{pointer-events:none}

    .face-hit{position:absolute;inset:0;z-index:25;border:0;background:transparent;cursor:pointer;padding:0;text-align:left}
    .face-hit span{position:absolute;left:clamp(28px,8vw,120px);bottom:max(7.5vh,calc(38px + env(safe-area-inset-bottom)));display:flex;flex-direction:column;gap:7px;text-shadow:0 2px 18px rgba(0,0,0,.6);transition:transform .45s ease,opacity .35s}
    .face-develop .face-hit span{left:auto;right:clamp(28px,8vw,120px);text-align:right;align-items:flex-end}
    .face-hit b{font:600 clamp(25px,4vw,62px)/.9 var(--font-ui);letter-spacing:-.035em}
    .face-hit small{font:10px/1.3 var(--font-ui);letter-spacing:.18em;text-transform:uppercase}
    .face-hit:hover span{transform:translateY(-9px)}
    .app:not([data-view="edge"]) .face-hit{pointer-events:none}
    .app:not([data-view="edge"]) .face-hit span{opacity:0}

    .face-ui{position:absolute;inset:0;z-index:14;pointer-events:none;opacity:0;transition:opacity .55s ease}
    .app[data-view="exposure"] .face-exposure .face-ui,.app[data-view="develop"] .face-develop .face-ui{opacity:1;pointer-events:auto;transition-delay:.72s}
    .mode-kicker{position:absolute;left:clamp(22px,3vw,46px);top:max(78px,calc(52px + env(safe-area-inset-top)));font:9px/1.4 var(--font-ui);letter-spacing:.19em;text-transform:uppercase;color:rgba(255,255,255,.66)}

    /* EXPOSURE — the wall exists before, during and after rotation. */
    .photo-wall{position:absolute;inset:0;padding:clamp(58px,7vh,88px) clamp(14px,2vw,30px) clamp(18px,3vh,34px);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(5px,.65vw,10px);background:#857d72;transform:translateZ(1px)}
    .photo-tile{position:relative;min-width:0;min-height:0;overflow:hidden;background:#3e3a35;border:1px solid rgba(255,255,255,.1);box-shadow:0 7px 22px rgba(0,0,0,.26);transition:filter .4s,opacity .35s,transform .55s var(--ease)}
    .photo-tile:nth-child(3n){transform:translateY(7px)}
    .photo-tile:nth-child(4n){transform:translateY(-5px)}
    .photo-tile img,.photo-tile canvas{width:100%;height:100%;display:block;object-fit:cover;filter:saturate(.7) contrast(1.08)}
    .photo-tile .tile-word{position:absolute;left:8px;bottom:7px;padding:4px 6px;background:rgba(5,5,4,.72);color:#fff;font:italic 11px/1 var(--font-poem);letter-spacing:.01em;opacity:.82}
    .photo-wall::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 30%,transparent 64%,rgba(0,0,0,.34))}
    .photo-tile.is-new{animation:tile-arrive 1s var(--ease) both}
    @keyframes tile-arrive{0%{opacity:0;transform:scale(1.35)}100%{opacity:1}}

    .exposure-panel{position:absolute;z-index:16;left:50%;bottom:max(26px,calc(18px + env(safe-area-inset-bottom)));width:min(760px,calc(100vw - 44px));transform:translateX(-50%) translateY(24px);display:grid;grid-template-columns:1.15fr .85fr auto;align-items:stretch;background:rgba(12,11,10,.86);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(18px);box-shadow:0 22px 70px rgba(0,0,0,.42);opacity:0;transition:opacity .45s,transform .7s var(--ease)}
    .app[data-view="exposure"] .exposure-panel{opacity:1;transform:translateX(-50%) translateY(0);transition-delay:1s}
    .upload-cell{position:relative;min-height:112px;border-right:1px solid var(--line);display:grid;place-items:center;overflow:hidden;cursor:pointer}
    .upload-cell input{position:absolute;opacity:0;pointer-events:none}
    .upload-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
    .upload-cell.has-image img{display:block}.upload-cell.has-image .upload-copy{opacity:0}
    .upload-copy{text-align:center;font:9px/1.6 var(--font-ui);letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.72)}
    .upload-copy b{display:block;font-size:24px;font-weight:300;color:var(--red-bright);line-height:1;margin-bottom:7px}
    .word-cell{padding:19px 20px;display:flex;flex-direction:column;justify-content:center}
    .word-cell label{font:8px/1.2 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.56)}
    .word-cell input{width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.28);background:transparent;color:white;padding:8px 0 5px;border-radius:0;font:italic clamp(24px,3vw,38px)/1 var(--font-poem)}
    .word-cell input::placeholder{color:rgba(255,255,255,.28)}
    .add-button{border:0;border-left:1px solid var(--line);background:var(--red);padding:0 24px;min-width:126px;cursor:pointer;font:700 9px/1.4 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;transition:background .2s}
    .add-button:hover{background:var(--red-bright)}.add-button:disabled{opacity:.38;cursor:not-allowed}
    .flying-photo{position:fixed;z-index:80;object-fit:cover;pointer-events:none;box-shadow:0 16px 60px rgba(0,0,0,.6)}

    /* Photo editor — opens after a file is chosen, before it joins the wall. */
    .photo-editor{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:rgba(2,2,2,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .photo-editor[hidden]{display:none}
    .editor-dialog{width:min(980px,100%);max-height:calc(var(--h) - 36px);display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.55fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden;border:1px solid rgba(255,255,255,.28);background:#12100e;box-shadow:0 35px 100px rgba(0,0,0,.72)}
    .editor-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
    .editor-head span{font:9px/1.3 var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.66)}
    .editor-head button{width:34px;height:34px;border:1px solid rgba(255,255,255,.24);background:transparent;cursor:pointer;font-size:20px;line-height:1}
    .editor-preview{position:relative;min-height:380px;display:grid;place-items:center;overflow:hidden;background:repeating-conic-gradient(#1b1916 0 25%,#24211d 0 50%) 50%/18px 18px}
    .editor-preview img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;will-change:filter}
    .editor-grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='e'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' stitchTiles='stitchTiles'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23e)'/%3E%3C/svg%3E")}
    .editor-controls{min-height:0;overflow:auto;padding:22px 22px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
    .editor-control{display:grid;grid-template-columns:1fr auto;gap:9px 14px;align-items:center}
    .editor-control label,.editor-control output{font:9px/1.2 var(--font-ui);letter-spacing:.14em;text-transform:uppercase}
    .editor-control label{color:rgba(255,255,255,.7)}.editor-control output{color:var(--red-bright)}
    .editor-control input{grid-column:1/-1;width:100%;accent-color:var(--red-bright)}
    .editor-actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:10px}
    .editor-actions button{min-height:44px;border:1px solid rgba(255,255,255,.3);background:transparent;cursor:pointer;font:700 9px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase}
    .editor-actions .apply-edit{border-color:var(--red);background:var(--red)}
    .editor-actions .apply-edit:hover{background:var(--red-bright)}

    /* DEVELOP — live words keep falling while the plane is angled. */
    .develop-stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 52%,rgba(162,24,12,.19),transparent 35%),linear-gradient(180deg,#090303,#020202)}
    .develop-stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10vw - 1px),rgba(255,50,35,.035) 10vw);pointer-events:none}
    .rain-field{position:absolute;inset:0;overflow:hidden}
    .rain-word{position:absolute;left:0;top:0;z-index:4;border:0;background:none;padding:6px 9px;white-space:nowrap;color:#ffcec5;cursor:grab;font:italic clamp(17px,1.7vw,27px)/1 var(--font-poem);text-shadow:0 0 14px rgba(255,55,35,.72);transform:translate3d(0,-100px,0);touch-action:none;will-change:transform}
    .rain-word::before{content:"";position:absolute;left:50%;bottom:72%;width:1px;height:var(--trail,100px);background:linear-gradient(0deg,rgba(255,58,39,.66),rgba(255,58,39,0));filter:blur(.2px);pointer-events:none}
    .rain-word::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#ffb0a4;box-shadow:0 0 13px #ff3824;pointer-events:none}
    .rain-word.selectable{z-index:13;color:#fff;background:rgba(151,21,12,.28);box-shadow:0 0 24px rgba(255,56,36,.24);text-shadow:0 0 20px #ff321f}
    .rain-word.dragging{z-index:30;cursor:grabbing;color:white;text-shadow:0 0 20px #ff321f}
    .rain-word.is-selected{opacity:0!important;pointer-events:none}
    .poem-track{position:absolute;z-index:12;left:4%;right:4%;top:52%;height:76px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:7px;padding:0 18px;border-top:1px solid rgba(255,83,64,.5);border-bottom:1px solid rgba(255,83,64,.5);background:linear-gradient(90deg,transparent,rgba(106,12,6,.32),transparent);box-shadow:0 0 42px rgba(117,15,7,.1);overflow-x:auto;scrollbar-width:none;transition:border-color .25s,background .25s}
    .poem-track::-webkit-scrollbar{display:none}
    .poem-track.is-hot{border-color:#ff604b;background:linear-gradient(90deg,transparent,rgba(185,29,17,.48),transparent)}
    .track-empty{font:8px/1 var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,190,179,.45);white-space:nowrap}
    .track-word{flex:0 0 auto;border:1px solid rgba(255,177,164,.48);background:#160806;color:#ffe4df;padding:8px 11px;cursor:grab;font:italic 17px/1 var(--font-poem);animation:track-in .35s var(--ease) both;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .16s,background .16s,opacity .16s}
    .track-word:hover{background:#3b0c07}
    .track-word.sorting{z-index:5;cursor:grabbing;background:#5a120b;border-color:#ff9b8d;transform:scale(1.08);box-shadow:0 10px 30px rgba(0,0,0,.42)}
    @keyframes track-in{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
    .develop-copy{position:absolute;z-index:14;left:clamp(22px,3vw,46px);bottom:max(28px,calc(18px + env(safe-area-inset-bottom)));max-width:430px;pointer-events:none}
    .develop-copy h2{margin:0 0 9px;font:600 clamp(34px,5vw,76px)/.84 var(--font-ui);letter-spacing:-.035em}
    .develop-copy p{margin:0;color:rgba(255,226,219,.58);font:10px/1.55 var(--font-ui);letter-spacing:.08em;text-transform:uppercase}
    .clear-track{position:absolute;z-index:15;right:clamp(22px,3vw,46px);bottom:max(31px,calc(21px + env(safe-area-inset-bottom)));border:1px solid rgba(255,255,255,.28);background:rgba(4,2,2,.5);padding:10px 14px;cursor:pointer;font:9px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase}

    .toast{position:fixed;z-index:90;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,18px);background:#f4eee5;color:#111;padding:11px 16px;opacity:0;pointer-events:none;transition:.3s;font:10px/1.2 var(--font-ui);letter-spacing:.08em;text-transform:uppercase}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media(max-width:760px){
      :root{--turn-time:1450ms}
      .scene{perspective:1050px}
      .photo-wall{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));padding-top:60px}
      .face-hit span{left:24px;bottom:max(9vh,calc(30px + env(safe-area-inset-bottom)))}
      .face-develop .face-hit span{left:auto;right:24px}
      .face-hit b{font-size:clamp(24px,7vw,44px)}
      .exposure-panel{grid-template-columns:.9fr 1.1fr;bottom:max(14px,env(safe-area-inset-bottom));width:calc(100vw - 24px)}
      .upload-cell{min-height:94px}.add-button{grid-column:1/-1;min-height:42px;border-left:0;border-top:1px solid var(--line)}
      .develop-copy h2{font-size:42px}.develop-copy p{max-width:240px}
      .poem-track{left:3%;right:3%;height:66px;justify-content:flex-start}.clear-track{bottom:max(24px,calc(16px + env(safe-area-inset-bottom)))}
      .edge-nav{width:calc(100vw - 24px);gap:7px;bottom:max(12px,env(safe-area-inset-bottom))}.edge-nav button{min-width:0;width:100%;height:44px;padding:0 12px;font-size:9px}
      .editor-dialog{grid-template-columns:1fr;grid-template-rows:auto minmax(220px,48vh) auto;max-height:calc(var(--h) - 24px)}

<body>
  <div class="app" id="app" data-view="edge">
    <div class="scene" id="scene">
      <div class="camera" id="camera">
        <div class="world" id="world">
          <section class="face face-exposure" aria-label="Exposure photo wall">
            <div class="g8-photo-desk" id="photoDesk" aria-label="Earlier uploaded photographs"></div>
            <div class="g8-exposure-shade"></div>
            <button class="face-hit" id="openExposure" type="button" aria-label="Open Exposure">
              <span><small>01 · Photograph + word</small><b>Exposure</b></span>
            </button>
            <div class="g8-exposure-hud">
              <div class="g8-word-stack"><label for="uploadWord">Write a word first</label><input id="uploadWord" maxlength="18" autocomplete="off" placeholder="belong" aria-describedby="wordPrompt"><small id="wordPrompt">Prompt: What last made you feel at home? Ignore it if you like—submit any word you want.</small></div>
              <label class="g8-desk-upload" id="uploadZone" for="photoInput"><input id="photoInput" type="file" accept="image/*">Add photo</label>
              <button class="small-button g8-sample" id="sampleButton" type="button">Sample</button>
            </div>
            <div class="g8-editor-modal" id="editorModal" aria-label="Edit uploaded photograph">

              <div class="g8-canvas-shell"><canvas id="editorCanvas" aria-label="Edited photo preview"></canvas></div>
              <aside class="g8-controls">
                <div class="g8-control"><label for="displace">Displace</label><output id="displaceValue">0</output><input id="displace" type="range" min="-120" max="120" value="0"></div>
                <div class="g8-control"><label for="step">Step size</label><output id="stepValue">12</output><input id="step" type="range" min="2" max="40" value="12"></div>
                <div class="g8-control"><label for="blur">Blur</label><output id="blurValue">0</output><input id="blur" type="range" min="0" max="12" step="1" value="0"></div>
                <div class="g8-control"><label for="grain">Grain</label><output id="grainValue">8</output><input id="grain" type="range" min="0" max="60" value="8"></div>
                <div class="g8-control"><label for="contrast">Contrast</label><output id="contrastValue">100</output><input id="contrast" type="range" min="50" max="170" value="100"></div>
                <div class="g8-control"><label for="saturation">Saturation</label><output id="saturationValue">100</output><input id="saturation" type="range" min="0" max="180" value="100"></div>

              </aside>
            </div>

            </div>

          <section class="face face-nebula" aria-label="Poem timeline archive">

    <nav class="edge-nav" aria-label="Choose a side">

  <script type="text/plain" id="generation13Script">
  (()=>{
    const app=document.getElementById('app');
    const scene=document.getElementById('scene');
    const camera=document.getElementById('camera');
    const wall=document.getElementById('photoWall');
    const field=document.getElementById('rainField');
    const track=document.getElementById('poemTrack');
    const form=document.getElementById('exposureForm');
    const fileInput=document.getElementById('photoInput');
    const wordInput=document.getElementById('wordInput');
    const preview=document.getElementById('uploadPreview');
    const uploadCell=document.getElementById('uploadCell');
    const addButton=document.getElementById('addToWall');
    const status=document.getElementById('viewStatus');
    const toastEl=document.getElementById('toast');
    const photoEditor=document.getElementById('photoEditor');
    const editorImage=document.getElementById('editorImage');
    const editorGrain=document.getElementById('editorGrain');
    const applyEdit=document.getElementById('applyEdit');
    const editInputs=[...photoEditor.querySelectorAll('[data-edit]')];
    const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)').matches;
    const palettes=[['#b65d38','#e6bb86','#27342f'],['#273e48','#9eb8aa','#e2c39c'],['#1d2738','#71879e','#d9c0a4'],['#795a42','#d8ad7e','#35302a'],['#59624b','#bdb276','#d16e4e'],['#a19b8f','#4b4a49','#d6cec0'],['#5c3431','#bd7460','#d8b897'],['#3d5252','#7d9790','#d6c5a5']];
    const seedWords=['morning','us','warmth','gathers','quietly','wherever','dreams','under','your','feet','distance','home','afterglow','tender','return','silence','window','almost','remember','between','softly','still','belong','drift'];
    let entries=seedWords.map((word,i)=>({id:'seed-'+i,word,src:'',palette:palettes[i%palettes.length],kind:i}));
    let selectedImage='';
    let originalImage='';
    let editState={blur:0,grain:12,contrast:108,saturation:80};
    let view='edge';
    let locked=false;
    let rain=[];
    let trackIds=[];
    let drag=null;
    let sortDrag=null;
    let lastTime=performance.now();

    function setViewport(){document.documentElement.style.setProperty('--h',`${window.innerHeight}px`)}
    setViewport();addEventListener('resize',setViewport,{passive:true});addEventListener('orientationchange',setViewport,{passive:true});

    function makeArt(canvas,palette,kind){
      const w=420,h=320,d=Math.min(devicePixelRatio||1,1.5);canvas.width=w*d;canvas.height=h*d;const c=canvas.getContext('2d');c.scale(d,d);
      const g=c.createLinearGradient(kind%2?w:0,0,kind%2?0:w,h);palette.forEach((p,i)=>g.addColorStop(i/(palette.length-1),p));c.fillStyle=g;c.fillRect(0,0,w,h);
      c.globalCompositeOperation='soft-light';
      for(let i=0;i<12;i++){const x=(kind*47+i*93)%500-30,y=(kind*81+i*61)%380-20,r=22+(i*29)%82;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=`rgba(255,244,222,${.035+(i%4)*.03})`;c.fill()}
      c.globalCompositeOperation='source-over';c.strokeStyle='rgba(248,231,202,.2)';c.lineWidth=1;
      for(let i=0;i<6;i++){c.beginPath();c.moveTo(0,(i+1)*45+(kind%3)*9);c.lineTo(w,(i+1)*34);c.stroke()}
      const img=c.getImageData(0,0,canvas.width,canvas.height);for(let i=0;i<img.data.length;i+=16){const n=(Math.random()-.5)*16;img.data[i]+=n;img.data[i+1]+=n;img.data[i+2]+=n}c.putImageData(img,0,0);
    }

    function renderWall(newId=''){
      wall.innerHTML='';const shown=entries.slice(-24);
      shown.forEach((entry,i)=>{const tile=document.createElement('article');tile.className='photo-tile'+(entry.id===newId?' is-new':'');tile.dataset.entry=entry.id;
        if(entry.src){const img=document.createElement('img');img.src=entry.src;img.alt=`Photograph for ${entry.word}`;tile.append(img)}else{const canvas=document.createElement('canvas');canvas.setAttribute('aria-label',`Abstract placeholder for ${entry.word}`);tile.append(canvas);requestAnimationFrame(()=>makeArt(canvas,entry.palette,entry.kind))}
        const label=document.createElement('span');label.className='tile-word';label.textContent=entry.word;tile.append(label);wall.append(tile)
      });
    }

    const turnDuration=reduceMotion?30:1850;
    function setStatus(next){status.textContent=next==='edge'?'Shared edge · choose a face':next==='exposure'?'Exposure · full page':'Develop · full page'}
    function turn(next){
      if(locked||next===view)return;
      locked=true;
      camera.style.setProperty('--pitch','0deg');camera.style.setProperty('--look','0deg');

      if(next==='edge'&&app.dataset.docked==='true'){
        /* Restore the mathematically identical 3D landing pose without a frame jump,
           then animate that same surface back to the shared edge. */
        world.classList.add('no-transition');
        delete app.dataset.docked;
        void world.offsetWidth;
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          world.classList.remove('no-transition');
          view='edge';app.dataset.view='edge';setStatus('edge');
          setTimeout(()=>locked=false,turnDuration);
        }));
        return;
      }

      delete app.dataset.docked;
      view=next;app.dataset.view=next;setStatus(next);
      setTimeout(()=>{
        if(view===next&&next!=='edge')app.dataset.docked='true';
        locked=false;
      },turnDuration);
    }
    document.getElementById('openExposure').onclick=()=>turn('exposure');
    document.getElementById('openDevelop').onclick=()=>turn('develop');
    document.getElementById('navExposure').onclick=()=>turn('exposure');
    document.getElementById('navDevelop').onclick=()=>turn('develop');
    document.getElementById('brand').onclick=()=>turn('edge');
    addEventListener('keydown',e=>{
      if(e.key==='Escape'&&!photoEditor.hidden){e.preventDefault();closePhotoEditor(true);return}
      if(photoEditor.hidden){if(e.key==='Escape')turn('edge');if(e.key==='ArrowLeft')turn('exposure');if(e.key==='ArrowRight')turn('develop')}
    });

    scene.addEventListener('pointermove',e=>{
      if(view!=='edge'||e.pointerType==='touch')return;
      const nx=e.clientX/innerWidth-.5,ny=e.clientY/innerHeight-.5;
      camera.style.setProperty('--pitch',`${(-ny*1.7).toFixed(2)}deg`);camera.style.setProperty('--look',`${(nx*1.4).toFixed(2)}deg`);
    },{passive:true});

    function showToast(text){toastEl.textContent=text;toastEl.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toastEl.classList.remove('show'),1800)}
    function validate(){addButton.disabled=!(selectedImage&&wordInput.value.trim())}
    function resizeImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1400,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.84))};img.src=r.result};r.readAsDataURL(file)})}
    function editorFilter(){return `blur(${editState.blur}px) contrast(${editState.contrast}%) saturate(${editState.saturation}%)`}
    function updateEditor(){
      editInputs.forEach(input=>{editState[input.dataset.edit]=Number(input.value)});
      editorImage.style.filter=editorFilter();
      editorGrain.style.opacity=String(editState.grain/100);
      document.getElementById('blurValue').textContent=editState.blur.toFixed(editState.blur%1?2:0);
      document.getElementById('grainValue').textContent=Math.round(editState.grain);
      document.getElementById('contrastValue').textContent=Math.round(editState.contrast)+'%';
      document.getElementById('saturationValue').textContent=Math.round(editState.saturation)+'%';
    }
    function openPhotoEditor(src){
      originalImage=src;editState={blur:0,grain:12,contrast:108,saturation:80};
      editInputs.forEach(input=>input.value=editState[input.dataset.edit]);
      editorImage.src=src;photoEditor.hidden=false;updateEditor();
      requestAnimationFrame(()=>document.getElementById('editBlur').focus());
    }
    function closePhotoEditor(clearSelection=false){
      photoEditor.hidden=true;editorImage.removeAttribute('style');
      if(clearSelection){originalImage='';fileInput.value=''}
      uploadCell.focus();
    }
    function exportEditedImage(src){return new Promise((resolve,reject)=>{
      const img=new Image();img.onerror=reject;img.onload=()=>{
        const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');
        const pad=editState.blur*3;x.filter=editorFilter();x.drawImage(img,-pad,-pad,c.width+pad*2,c.height+pad*2);x.filter='none';
        if(editState.grain>0){const pixels=x.getImageData(0,0,c.width,c.height),d=pixels.data,amount=editState.grain*.34;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*amount;d[i]+=n;d[i+1]+=n;d[i+2]+=n}x.putImageData(pixels,0,0)}
        resolve(c.toDataURL('image/jpeg',.88));
      };img.src=src;
    })}
    editInputs.forEach(input=>input.addEventListener('input',updateEditor));
    document.getElementById('closeEditor').onclick=()=>closePhotoEditor(true);
    document.getElementById('cancelEdit').onclick=()=>closePhotoEditor(true);
    photoEditor.addEventListener('pointerdown',e=>{if(e.target===photoEditor)closePhotoEditor(true)});
    applyEdit.onclick=async()=>{if(!originalImage)return;applyEdit.disabled=true;applyEdit.textContent='Processing…';try{selectedImage=await exportEditedImage(originalImage);preview.src=selectedImage;uploadCell.classList.add('has-image');originalImage='';fileInput.value='';closePhotoEditor(false);validate();showToast('Photograph adjusted')}catch{showToast('The edit could not be applied')}finally{applyEdit.disabled=false;applyEdit.textContent='Use photograph'}};
    fileInput.onchange=async()=>{const f=fileInput.files&&fileInput.files[0];if(!f)return;try{openPhotoEditor(await resizeImage(f))}catch{fileInput.value='';showToast('That image could not be read')}};
    uploadCell.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click()}};
    wordInput.oninput=validate;

    async function flyToTile(src,id,startRect){
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const tile=wall.querySelector(`[data-entry="${id}"]`);if(!tile)return;const end=tile.getBoundingClientRect();
      if(reduceMotion){tile.style.opacity='1';return}tile.style.opacity='0';const flyer=document.createElement('img');flyer.className='flying-photo';flyer.src=src;Object.assign(flyer.style,{left:startRect.left+'px',top:startRect.top+'px',width:startRect.width+'px',height:startRect.height+'px'});document.body.append(flyer);
      const anim=flyer.animate([{left:startRect.left+'px',top:startRect.top+'px',width:startRect.width+'px',height:startRect.height+'px',borderRadius:'0px'},{left:end.left+'px',top:end.top+'px',width:end.width+'px',height:end.height+'px',borderRadius:'0px'}],{duration:1150,easing:'cubic-bezier(.65,0,.18,1)',fill:'forwards'});
      await anim.finished.catch(()=>{});tile.style.opacity='1';flyer.remove();
    }
    form.onsubmit=e=>{e.preventDefault();const word=wordInput.value.trim();if(!selectedImage||!word)return;const src=selectedImage,id='user-'+Date.now(),start=preview.getBoundingClientRect();entries.push({id,word,src,palette:palettes[0],kind:entries.length});renderWall(id);spawnRain(entryToRain(entries[entries.length-1]));flyToTile(src,id,start);selectedImage='';preview.removeAttribute('src');uploadCell.classList.remove('has-image');fileInput.value='';wordInput.value='';validate();showToast('Image and word joined the wall')};

    function entryToRain(entry){return{id:entry.id,word:entry.word,entry}}
    function spawnRain(source,index=rain.length){
      const el=document.createElement('button');el.type='button';el.className='rain-word';el.textContent=source.word;el.setAttribute('aria-label',`${source.word}. Drag to the centre track.`);field.append(el);
      const token={...source,el,x:4+((index*37)%88),y:-10-((index*29)%120),speed:7+((index*17)%11),trail:72+((index*23)%100),dragging:false,holding:false,selected:false};el.style.setProperty('--trail',token.trail+'px');rain.push(token);
      el.addEventListener('pointerdown',ev=>startDrag(token,ev));return token;
    }
    function resetToken(t,stagger=true){t.x=4+Math.random()*88;t.y=stagger?-(10+Math.random()*125):-12;t.speed=6+Math.random()*13;t.el.style.opacity=.45+Math.random()*.55}
    function rainLoop(now){const dt=Math.min(.035,(now-lastTime)/1000);lastTime=now;const h=field.clientHeight||innerHeight,w=field.clientWidth||innerWidth;
      const trackY=h*.52,trackHalf=(track.offsetHeight||76)/2;
      rain.forEach(t=>{if(t.selected)return;if(t.dragging||t.holding)return;t.y+=t.speed*dt;if(t.y>112)resetToken(t,false);t.el.style.transform=`translate3d(${t.x/100*w-t.el.offsetWidth/2}px,${t.y/100*h}px,0)`;const centre=t.y/100*h+t.el.offsetHeight/2;t.el.classList.toggle('selectable',view==='develop'&&Math.abs(centre-trackY)<=trackHalf)});requestAnimationFrame(rainLoop)}

    function tokenTouchesTrack(token){const wr=token.el.getBoundingClientRect(),tr=track.getBoundingClientRect();return wr.bottom>=tr.top&&wr.top<=tr.bottom}
    function startDrag(token,e){if(view!=='develop'||token.selected)return;e.preventDefault();token.holding=true;try{token.el.setPointerCapture(e.pointerId)}catch{}drag={token,pointer:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false,startedOnTrack:token.el.classList.contains('selectable')||tokenTouchesTrack(token)};
      const move=ev=>{if(!drag||drag.token!==token)return;if(!drag.moved&&Math.hypot(ev.clientX-drag.startX,ev.clientY-drag.startY)>6){drag.moved=true;token.dragging=true;token.el.classList.add('dragging')}if(drag.moved)moveDragged(token,ev)};
      const end=ev=>{token.el.removeEventListener('pointermove',move);token.el.removeEventListener('pointerup',end);token.el.removeEventListener('pointercancel',cancel);finishDrag(token,ev)};
      const cancel=ev=>{token.el.removeEventListener('pointermove',move);token.el.removeEventListener('pointerup',end);token.el.removeEventListener('pointercancel',cancel);token.holding=false;token.dragging=false;token.el.classList.remove('dragging');drag=null;try{token.el.releasePointerCapture(ev.pointerId)}catch{}};
      token.el.addEventListener('pointermove',move);token.el.addEventListener('pointerup',end);token.el.addEventListener('pointercancel',cancel)
    }
    function moveDragged(token,e){const r=field.getBoundingClientRect(),x=e.clientX-r.left-token.el.offsetWidth/2,y=e.clientY-r.top-token.el.offsetHeight/2;token.el.style.transform=`translate3d(${x}px,${y}px,0)`;const tr=track.getBoundingClientRect();track.classList.toggle('is-hot',e.clientY>tr.top-30&&e.clientY<tr.bottom+30)}
    function finishDrag(token,e){const active=drag,tr=track.getBoundingClientRect(),dropped=active&&active.moved&&e.clientY>tr.top-38&&e.clientY<tr.bottom+38,clicked=active&&!active.moved&&(active.startedOnTrack||tokenTouchesTrack(token));token.holding=false;token.dragging=false;token.el.classList.remove('dragging');track.classList.remove('is-hot');drag=null;if(dropped||clicked)addToTrack(token.id);else resetToken(token,true);try{token.el.releasePointerCapture(e.pointerId)}catch{}}
    function setRainSelected(id,selected){const token=rain.find(t=>t.id===id);if(!token)return;token.selected=selected;token.holding=false;token.dragging=false;token.el.classList.toggle('is-selected',selected);token.el.classList.remove('selectable','dragging');if(!selected)resetToken(token,true)}
    function addToTrack(id){if(trackIds.includes(id))return;trackIds.push(id);setRainSelected(id,true);renderTrack();showToast('Word added to the line')}
    function releaseFromTrack(id){trackIds=trackIds.filter(v=>v!==id);setRainSelected(id,false);renderTrack()}
    function makeTrackSortable(b,id){
      b.addEventListener('pointerdown',e=>{e.preventDefault();const startX=e.clientX;let moved=false;sortDrag={id,el:b};try{b.setPointerCapture(e.pointerId)}catch{}
        const move=ev=>{if(!moved&&Math.abs(ev.clientX-startX)>6){moved=true;b.classList.add('sorting')}if(!moved)return;const siblings=[...track.querySelectorAll('.track-word')].filter(node=>node!==b);const before=siblings.find(node=>ev.clientX<node.getBoundingClientRect().left+node.offsetWidth/2);track.insertBefore(b,before||null);const r=track.getBoundingClientRect();if(ev.clientX<r.left+45)track.scrollLeft-=10;if(ev.clientX>r.right-45)track.scrollLeft+=10};
        const finish=ev=>{b.removeEventListener('pointermove',move);b.removeEventListener('pointerup',up);b.removeEventListener('pointercancel',cancel);b.classList.remove('sorting');sortDrag=null;try{b.releasePointerCapture(ev.pointerId)}catch{}if(moved){trackIds=[...track.querySelectorAll('.track-word')].map(node=>node.dataset.id);showToast('Word order updated')}else releaseFromTrack(id)};
        const up=ev=>finish(ev);const cancel=ev=>{moved=true;finish(ev)};
        b.addEventListener('pointermove',move);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',cancel)
      })
    }
    function renderTrack(){track.innerHTML='';if(!trackIds.length){const empty=document.createElement('span');empty.className='track-empty';empty.textContent='Click a word as it crosses this track';track.append(empty);return}trackIds.forEach(id=>{const entry=entries.find(e=>e.id===id);if(!entry)return;const b=document.createElement('button');b.type='button';b.className='track-word';b.dataset.id=id;b.textContent=entry.word;b.title='Drag left or right to reorder. Click to release.';b.setAttribute('aria-label',`${entry.word}. Drag left or right to reorder; click to release.`);makeTrackSortable(b,id);track.append(b)})}
    document.getElementById('clearTrack').onclick=()=>{trackIds.forEach(id=>setRainSelected(id,false));trackIds=[];renderTrack();showToast('Track cleared')};

    renderWall();entries.forEach((e,i)=>spawnRain(entryToRain(e),i));renderTrack();requestAnimationFrame(rainLoop);
  })();

    function makeTimelineDoc(images){
      return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Latent Poem</title>
<style>
:root{--paper:#f3efe6;--muted:rgba(243,239,230,.54);--faint:rgba(243,239,230,.18);--red:#ff533f;--bg:#030407;--font-ui:"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;--font-poem:"Iowan Old Style",Baskerville,"Times New Roman",serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--paper);font-family:var(--font-ui)}
body{touch-action:none;cursor:grab}
body.dragging{cursor:grabbing}
.grain,.vignette{position:fixed;inset:0;pointer-events:none;z-index:30}
.grain{opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
.vignette{box-shadow:inset 0 0 20vw rgba(0,0,0,.7)}
.stars{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;width:1px;height:1px;border-radius:50%;background:#cbd6e8;opacity:var(--o);box-shadow:0 0 5px rgba(196,213,241,.45)}
.viewport{position:absolute;inset:0;overflow:hidden}
.world{position:absolute;left:0;top:0;width:5200px;height:100%;will-change:transform;transform:translate3d(0,0,0)}
.axis{position:absolute;left:0;top:50%;width:100%;height:1px;background:linear-gradient(90deg,transparent 0,rgba(243,239,230,.22) 3%,rgba(243,239,230,.52) 50%,rgba(243,239,230,.22) 97%,transparent);box-shadow:0 0 18px rgba(180,200,234,.13)}
.year{position:absolute;top:calc(50% - 9px);transform:translate(-50%,-100%);font-size:10px;letter-spacing:.18em;color:rgba(243,239,230,.34)}
.year:after{content:"";display:block;width:1px;height:18px;margin:8px auto 0;background:rgba(243,239,230,.25)}
.event{position:absolute;left:var(--x);top:50%;width:300px;height:0;transform:translateX(-50%);z-index:4}
.event .node{position:absolute;left:50%;top:0;width:10px;height:10px;border:1px solid rgba(243,239,230,.74);border-radius:50%;background:#050609;transform:translate(-50%,-50%);transition:.35s;box-shadow:0 0 0 0 rgba(255,83,63,0)}
.event .stem{position:absolute;left:50%;width:1px;height:var(--stem);background:linear-gradient(var(--dir),rgba(243,239,230,.42),rgba(243,239,230,.08));transform:translateX(-50%)}
.event.above .stem{bottom:5px}.event.below .stem{top:5px}
.event .date{position:absolute;left:50%;white-space:nowrap;transform:translateX(-50%);font-size:9px;letter-spacing:.18em;color:rgba(243,239,230,.55);transition:.35s}
.event.above .date{top:16px}.event.below .date{bottom:16px}
.film{position:absolute;left:50%;width:286px;height:122px;padding:14px 12px;background:#101116;border:1px solid rgba(243,239,230,.16);transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,1fr);gap:5px;overflow:hidden;cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .35s,filter .35s,opacity .35s;filter:saturate(.78) brightness(.73);opacity:.68;box-shadow:0 20px 48px rgba(0,0,0,.35)}
.event.above .film{bottom:calc(var(--stem) + 5px)}.event.below .film{top:calc(var(--stem) + 5px)}
.film:before,.film:after{content:"";position:absolute;left:0;right:0;height:7px;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(243,239,230,.2) 8px 13px,transparent 13px 20px)}
.film:before{top:3px}.film:after{bottom:3px}
.film img{width:100%;height:94px;object-fit:cover;display:block;filter:contrast(1.08) saturate(.84)}
.event.active{z-index:8}.event.active .node{background:var(--red);border-color:var(--red);box-shadow:0 0 0 8px rgba(255,83,63,.11),0 0 24px rgba(255,83,63,.45)}
.event.active .date{color:var(--paper)}
.event.active .film{transform:translateX(-50%) scale(1.07);border-color:rgba(243,239,230,.6);filter:saturate(1) brightness(1);opacity:1}
.event:not(.active) .film:hover{opacity:.92;filter:saturate(.95) brightness(.9)}
.focus-line{position:fixed;left:50%;top:calc(50% - 31px);width:1px;height:62px;background:linear-gradient(transparent,var(--red),transparent);z-index:12;pointer-events:none}
.focus-line:after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:var(--red);transform:translate(-50%,-50%);box-shadow:0 0 16px var(--red)}
.readout{position:fixed;left:max(24px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));z-index:14;display:flex;align-items:baseline;gap:14px;pointer-events:none}
.readout .current{font:500 clamp(22px,3vw,46px)/1 var(--font-ui);letter-spacing:.06em}
.readout .counter{font-size:8px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.hint{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));z-index:14;font-size:8px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;pointer-events:none}
.progress{position:fixed;left:20%;right:20%;bottom:10px;height:1px;background:rgba(243,239,230,.12);z-index:14}.progress span{display:block;width:0;height:100%;background:var(--red);transition:width .18s}
.detail{position:fixed;inset:0;z-index:50;background:rgba(3,4,7,.96);backdrop-filter:blur(18px);display:grid;align-content:center;gap:28px;padding:10vh 5vw;opacity:0;visibility:hidden;transition:.45s;cursor:default}
